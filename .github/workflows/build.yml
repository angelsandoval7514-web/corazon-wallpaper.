name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q CorazonWallpaper.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Permisos
        run: chmod +x gradlew
        working-directory: CorazonWallpaper

      - name: Compilar
        run: ./gradlew assembleDebug --no-daemon
        working-directory: CorazonWallpaper

      - uses: actions/upload-artifact@v4
        with:
          name: corazon-apk
          path: CorazonWallpaper/app/build/outputs/apk/debug/app-debug.apk
